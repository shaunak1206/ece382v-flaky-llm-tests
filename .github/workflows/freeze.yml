name: freeze-envs

# Record uv pip freeze for every known flaky code study project (scripts/freeze_env.py).
on:
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 -c "import json; n=open('results/gruber/matched_projects.txt').read().split()+open('results/gruber/matched_projects_od.txt').read().split(); print('matrix='+json.dumps({'project': n}))" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          mkdir -p out
          python3 scripts/freeze_env.py "${{ matrix.project }}" --out "out/${{ matrix.project }}.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: env-${{ strategy.job-index }}
          path: out/*.txt
          if-no-files-found: warn
