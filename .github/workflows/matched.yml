name: matched-study

# Matched study: rerun LLM suites that target the same code as each reproduced Gruber et al. flaky test,
# plus the human flaky test as a control. See scripts/matched_run.py for the output format.
#   gh workflow run matched-study -f runs=150
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "repeated runs of each known flaky test"
        default: "150"
      only:
        description: "optional comma separated project names"
        default: ""
      suites:
        description: "glob over suite ids to run (e.g. *_guard_*)"
        default: "*"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json
          only = [x for x in "${{ inputs.only }}".split(",") if x]
          names = open("results/gruber/matched_projects.txt").read().split()
          names = [n for n in names if not only or n in only]
          print("matrix=" + json.dumps({"project": names}))
          PY

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: reproduce
        run: |
          mkdir -p out
          python3 scripts/matched_run.py "${{ matrix.project }}" --work /tmp/mw --runs "${{ inputs.runs }}" \
            --suites "${{ inputs.suites }}" --out "out/${{ matrix.project }}.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ms-${{ strategy.job-index }}
          path: out/*.json
          if-no-files-found: warn

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ms-*
          merge-multiple: true
          path: out
      - uses: actions/upload-artifact@v4
        with:
          name: matched-results
          path: out/
